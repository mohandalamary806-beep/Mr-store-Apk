name: Build MR Store APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build native Google sign-in bridge
        run: npm run build:web

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android icons and splash assets
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0A1230' --splashBackgroundColor '#0A1230'

      # Replaces the generated launcher icons with crisp per-density versions and
      # applies the MR Store launch (splash) screen: navy background + glowing logo.
      - name: Apply MR Store icon and splash screen
        run: python3 .github/scripts/apply_android_overrides.py

      - name: Sync web app
        run: npx cap sync android

      # Cache a dedicated debug keystore so repeated test builds keep
      # the same SHA-1. For production, use a private release keystore.
      - name: Restore Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: mr-store-debug-keystore-v1

      - name: Create Android debug signing key when missing
        shell: bash
        run: |
          KEYSTORE="$HOME/.config/.android/debug.keystore"
          mkdir -p "$(dirname "$KEYSTORE")"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "C=US, O=Android, CN=Android Debug"
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew -I ../.github/gradle/kotlin-stdlib-compat.init.gradle assembleDebug

      - name: Print SHA-1 from the built APK
        run: |
          echo "SHA-1 and SHA-256 for the exact APK being uploaded:"
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk |
            grep -E 'SHA1:|SHA256:'

      - name: Name the APK MR-Store.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MR-Store.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MR-Store
          path: MR-Store.apk
          if-no-files-found: error

      # Direct download link that always points to the newest build:
      # https://github.com/<user>/<repo>/releases/latest/download/MR-Store.apk
      - name: Publish release (MR-Store.apk)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MR-Store.apk \
            --title "MR Store" \
            --notes "Latest MR Store build ($(date -u +'%Y-%m-%d %H:%M UTC'))." \
            --target "${{ github.sha }}" \
            --latest
